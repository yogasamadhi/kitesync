name: kitesync-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kitesync
      POSTGRES_PASSWORD: kitesync
      POSTGRES_USER: kitesync
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kitesync -d kitesync']
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: kitesync
      MINIO_ROOT_PASSWORD: kitesync-development
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 3s
      timeout: 3s
      retries: 30
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >
        mc alias set local http://minio:9000 kitesync kitesync-development &&
        mc mb --ignore-existing local/kitesync
    restart: 'no'

  hub-volume-init:
    image: alpine:3.22
    command: ['sh', '-c', 'chown -R 1000:1000 /state /data /agent']
    user: '0:0'
    volumes:
      - hub-state:/state
      - hub-data:/data
      - hub-agent-state:/agent
    restart: 'no'

  syncthing-hub:
    image: syncthing/syncthing:2.1.3
    command:
      - serve
      - --gui-address=127.0.0.1:8384
      - --gui-apikey=kitesync-development-api-key
      - --no-browser
      - --no-restart
      - --no-upgrade
    environment:
      PUID: '1000'
      PGID: '1000'
    depends_on:
      hub-volume-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -q -O - --header="X-API-Key: kitesync-development-api-key" http://127.0.0.1:8384/rest/noauth/health || exit 1',
        ]
      interval: 3s
      timeout: 3s
      retries: 60
    ports:
      - '127.0.0.1:9443:9443'
      - '127.0.0.1:22000:22000/tcp'
      - '127.0.0.1:22000:22000/udp'
    volumes:
      - hub-state:/var/syncthing/config
      - hub-data:/var/syncthing/data
      - hub-agent-state:/var/lib/kitesync-agent

  hub-agent:
    build:
      context: ../..
      dockerfile: services/hub-agent/Dockerfile
      target: development
    network_mode: service:syncthing-hub
    depends_on:
      syncthing-hub:
        condition: service_healthy
    environment:
      KITESYNC_HUB_AGENT_HOST: 0.0.0.0
      KITESYNC_HUB_AGENT_PORT: '9443'
      KITESYNC_HUB_AGENT_STATE_PATH: /var/lib/kitesync-agent/desired-state.json
      KITESYNC_HUB_AGENT_TLS_CA: /certs/ca.crt
      KITESYNC_HUB_AGENT_TLS_CERT: /certs/hub-agent.crt
      KITESYNC_HUB_AGENT_TLS_KEY: /certs/hub-agent.key
      KITESYNC_SYNCTHING_API_KEY: kitesync-development-api-key
      KITESYNC_SYNCTHING_URL: http://127.0.0.1:8384
    volumes:
      - ../../services/hub-agent/src:/workspace/services/hub-agent/src:ro
      - ../../packages/contracts/src:/workspace/packages/contracts/src:ro
      - ./certs:/certs:ro
      - hub-agent-state:/var/lib/kitesync-agent

volumes:
  hub-agent-state:
  hub-data:
  hub-state:
  minio-data:
  postgres-data:
