global:
  imagePullSecrets: []
  storageClass: ''

controlPlane:
  image: ghcr.io/example/kitesync-control-plane:1.0.0
  replicas: 1
  resources:
    requests: { cpu: 200m, memory: 256Mi }
    limits: { cpu: '2', memory: 1Gi }
  bootstrapToken: ''
  cookieSecret: ''
  updatePublicKey: ''

web:
  image: ghcr.io/example/kitesync-web:1.0.0
  replicas: 1
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }

hub:
  syncthingImage: syncthing/syncthing:2.1.3
  agentImage: ghcr.io/example/kitesync-hub-agent:1.0.0
  apiKey: ''
  publicAddress: tcp://kitesync.example.lan:22000
  stateStorage: 20Gi
  dataStorage: 10Ti
  resources:
    syncthing:
      requests: { cpu: 500m, memory: 1Gi }
      limits: { cpu: '8', memory: 16Gi }
    agent:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: '1', memory: 512Mi }

postgresql:
  internal: true
  image: ghcr.io/example/kitesync-postgresql:1.0.0
  database: kitesync
  username: kitesync
  password: ''
  storage: 100Gi
  externalUrl: ''
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: '2', memory: 2Gi }
  pgBackRest:
    fullBackupIntervalSeconds: 86400
    retentionFull: 30
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: '1', memory: 1Gi }

tls:
  existingSecret: kitesync-tls
  issuerRef: ''
  issuerKind: ClusterIssuer
  hubAgentSecret: kitesync-hub-agent-mtls

ingress:
  enabled: true
  className: nginx
  host: kitesync.example.lan
  annotations: {}

backup:
  enabled: true
  schedule: '15 2 * * *'
  image: ghcr.io/example/kitesync-backup-controller:1.0.0
  resticImage: restic/restic:0.18.1
  snapshotClass: ''
  resticPassword: ''
  controllerToken: ''
  s3:
    endpoint: ''
    port: 443
    bucket: kitesync
    accessKey: ''
    secretKey: ''
  retention: { daily: 30, weekly: 12, monthly: 12 }

monitoring:
  serviceMonitor: true

networkPolicy:
  enabled: true
