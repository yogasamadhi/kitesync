apiVersion: apps/v1
kind: Deployment
metadata:
  name: kitesync-control-plane
  labels: {{- include "kitesync.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.controlPlane.replicas }}
  strategy: { type: Recreate }
  selector: { matchLabels: { app.kubernetes.io/component: control-plane } }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kitesync
        app.kubernetes.io/component: control-plane
    spec:
      serviceAccountName: kitesync
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      initContainers:
        - name: migrate
          image: {{ .Values.controlPlane.image }}
          command: ["node", "dist/db/migrate.js"]
          env: &control-env
            - { name: KITESYNC_DATABASE_URL, valueFrom: { secretKeyRef: { name: kitesync-application, key: database-url } } }
            - { name: KITESYNC_BOOTSTRAP_TOKEN, valueFrom: { secretKeyRef: { name: kitesync-application, key: bootstrap-token } } }
            - { name: KITESYNC_COOKIE_SECRET, valueFrom: { secretKeyRef: { name: kitesync-application, key: cookie-secret } } }
            - { name: KITESYNC_BACKUP_CONTROLLER_TOKEN, valueFrom: { secretKeyRef: { name: kitesync-application, key: backup-controller-token } } }
            - { name: KITESYNC_HUB_AGENT_URL, value: "https://kitesync-hub-agent:9443" }
            - { name: KITESYNC_HUB_PUBLIC_ADDRESS, value: {{ .Values.hub.publicAddress | quote }} }
            - { name: KITESYNC_HUB_AGENT_CA, value: /tls/ca.crt }
            - { name: KITESYNC_HUB_AGENT_CERT, value: /tls/tls.crt }
            - { name: KITESYNC_HUB_AGENT_KEY, value: /tls/tls.key }
            - { name: KITESYNC_PUBLIC_URL, value: {{ printf "https://%s" .Values.ingress.host | quote }} }
            - { name: KITESYNC_UPDATE_PUBLIC_KEY_FILE, value: /application-keys/update-public-key.pem }
      containers:
        - name: control-plane
          image: {{ .Values.controlPlane.image }}
          imagePullPolicy: IfNotPresent
          env: *control-env
          envFrom: []
          ports: [{ name: http, containerPort: 3000 }]
          readinessProbe: { httpGet: { path: /health/ready, port: http }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /health/live, port: http }, initialDelaySeconds: 15 }
          resources: {{- toYaml .Values.controlPlane.resources | nindent 12 }}
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: hub-mtls, mountPath: /tls, readOnly: true }
            - { name: application-keys, mountPath: /application-keys, readOnly: true }
      volumes:
        - { name: tmp, emptyDir: {} }
        - { name: hub-mtls, secret: { secretName: {{ .Values.tls.hubAgentSecret }} } }
        - name: application-keys
          secret:
            secretName: kitesync-application
            items: [{ key: update-public-key, path: update-public-key.pem }]
---
apiVersion: v1
kind: Service
metadata: { name: kitesync-control-plane, labels: { app.kubernetes.io/name: kitesync, app.kubernetes.io/component: control-plane } }
spec:
  selector: { app.kubernetes.io/component: control-plane }
  ports: [{ name: http, port: 3000, targetPort: http }]
