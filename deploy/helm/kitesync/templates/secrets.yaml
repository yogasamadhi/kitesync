apiVersion: v1
kind: Secret
metadata:
  name: kitesync-application
  labels: {{- include "kitesync.labels" . | nindent 4 }}
type: Opaque
stringData:
  bootstrap-token: {{ required "controlPlane.bootstrapToken is required" .Values.controlPlane.bootstrapToken | quote }}
  cookie-secret: {{ required "controlPlane.cookieSecret is required" .Values.controlPlane.cookieSecret | quote }}
  update-public-key: {{ .Values.controlPlane.updatePublicKey | quote }}
  database-url: {{ include "kitesync.databaseUrl" . | quote }}
  hub-api-key: {{ required "hub.apiKey is required" .Values.hub.apiKey | quote }}
  s3-access-key: {{ .Values.backup.s3.accessKey | quote }}
  s3-secret-key: {{ .Values.backup.s3.secretKey | quote }}
  restic-password: {{ if .Values.backup.enabled }}{{ required "backup.resticPassword is required when backup is enabled" .Values.backup.resticPassword | quote }}{{ else }}""{{ end }}
  backup-controller-token: {{ if .Values.backup.enabled }}{{ required "backup.controllerToken is required when backup is enabled" .Values.backup.controllerToken | quote }}{{ else }}"disabled"{{ end }}
