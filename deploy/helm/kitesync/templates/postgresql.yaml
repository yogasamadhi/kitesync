{{- if .Values.postgresql.internal }}
apiVersion: v1
kind: Service
metadata: { name: kitesync-postgresql }
spec:
  selector: { app.kubernetes.io/component: postgresql }
  ports: [{ name: postgres, port: 5432 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: kitesync-postgresql }
spec:
  serviceName: kitesync-postgresql
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/component: postgresql } }
  template:
    metadata: { labels: { app.kubernetes.io/name: kitesync, app.kubernetes.io/component: postgresql } }
    spec:
      containers:
        - name: postgresql
          image: {{ .Values.postgresql.image }}
          {{- if .Values.backup.enabled }}
          args:
            - -c
            - archive_mode=on
            - -c
            - archive_timeout=900s
            - -c
            - archive_command=pgbackrest --stanza=kitesync archive-push %p
          {{- end }}
          env:
            - { name: POSTGRES_DB, value: {{ .Values.postgresql.database | quote }} }
            - { name: POSTGRES_USER, value: {{ .Values.postgresql.username | quote }} }
            - { name: POSTGRES_PASSWORD, value: {{ required "postgresql.password is required" .Values.postgresql.password | quote }} }
            {{- if .Values.backup.enabled }}
            - { name: PGBACKREST_REPO1_S3_KEY, valueFrom: { secretKeyRef: { name: kitesync-application, key: s3-access-key } } }
            - { name: PGBACKREST_REPO1_S3_KEY_SECRET, valueFrom: { secretKeyRef: { name: kitesync-application, key: s3-secret-key } } }
            {{- end }}
          ports: [{ name: postgres, containerPort: 5432 }]
          readinessProbe: { exec: { command: ["pg_isready", "-U", {{ .Values.postgresql.username | quote }}] } }
          livenessProbe: { exec: { command: ["pg_isready", "-U", {{ .Values.postgresql.username | quote }}] }, initialDelaySeconds: 30 }
          resources: {{- toYaml .Values.postgresql.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            {{- if .Values.backup.enabled }}
            - { name: pgbackrest-config, mountPath: /etc/pgbackrest, readOnly: true }
            {{- end }}
        {{- if .Values.backup.enabled }}
        - name: pgbackrest
          image: {{ .Values.postgresql.image }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              until pg_isready -h 127.0.0.1 -U {{ .Values.postgresql.username }}; do sleep 5; done
              pgbackrest --stanza=kitesync stanza-create
              pgbackrest --stanza=kitesync check
              while true; do
                pgbackrest --stanza=kitesync --type=full backup
                sleep {{ .Values.postgresql.pgBackRest.fullBackupIntervalSeconds }}
              done
          env:
            - { name: PGBACKREST_REPO1_S3_KEY, valueFrom: { secretKeyRef: { name: kitesync-application, key: s3-access-key } } }
            - { name: PGBACKREST_REPO1_S3_KEY_SECRET, valueFrom: { secretKeyRef: { name: kitesync-application, key: s3-secret-key } } }
          resources:
            {{- toYaml .Values.postgresql.pgBackRest.resources | nindent 12 }}
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: pgbackrest-config, mountPath: /etc/pgbackrest, readOnly: true }
        {{- end }}
      {{- if .Values.backup.enabled }}
      volumes:
        - { name: pgbackrest-config, configMap: { name: kitesync-pgbackrest } }
      {{- end }}
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.global.storageClass }}
        storageClassName: {{ .Values.global.storageClass }}
        {{- end }}
        resources: { requests: { storage: {{ .Values.postgresql.storage }} } }
{{- end }}
