apiVersion: apps/v1
kind: Deployment
metadata: { name: kitesync-web }
spec:
  replicas: {{ .Values.web.replicas }}
  selector: { matchLabels: { app.kubernetes.io/component: web } }
  template:
    metadata: { labels: { app.kubernetes.io/name: kitesync, app.kubernetes.io/component: web } }
    spec:
      serviceAccountName: kitesync
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: web
          image: {{ .Values.web.image }}
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /health, port: http } }
          livenessProbe: { httpGet: { path: /health, port: http }, initialDelaySeconds: 10 }
          resources: {{- toYaml .Values.web.resources | nindent 12 }}
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } }
---
apiVersion: v1
kind: Service
metadata: { name: kitesync-web, labels: { app.kubernetes.io/name: kitesync, app.kubernetes.io/component: web } }
spec:
  selector: { app.kubernetes.io/component: web }
  ports: [{ name: http, port: 8080, targetPort: http }]
