apiVersion: v1
kind: Service
metadata: { name: kitesync-hub-headless }
spec:
  clusterIP: None
  selector: { app.kubernetes.io/component: hub }
  ports: [{ name: syncthing-tcp, port: 22000 }, { name: syncthing-quic, port: 22000, protocol: UDP }]
---
apiVersion: v1
kind: Service
metadata: { name: kitesync-hub-data }
spec:
  type: LoadBalancer
  selector: { app.kubernetes.io/component: hub }
  ports: [{ name: syncthing-tcp, port: 22000, targetPort: 22000 }, { name: syncthing-quic, port: 22000, targetPort: 22000, protocol: UDP }]
---
apiVersion: v1
kind: Service
metadata: { name: kitesync-hub-agent, labels: { app.kubernetes.io/name: kitesync, app.kubernetes.io/component: hub-agent } }
spec:
  selector: { app.kubernetes.io/component: hub }
  ports: [{ name: mtls, port: 9443, targetPort: 9443 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: kitesync-hub }
spec:
  serviceName: kitesync-hub-headless
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/component: hub } }
  template:
    metadata: { labels: { app.kubernetes.io/name: kitesync, app.kubernetes.io/component: hub } }
    spec:
      terminationGracePeriodSeconds: 120
      securityContext: { fsGroup: 1000, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: syncthing
          image: {{ .Values.hub.syncthingImage }}
          args: ["serve", "--gui-address=127.0.0.1:8384", "--gui-apikey=$(SYNCTHING_API_KEY)", "--no-browser", "--no-restart", "--no-upgrade"]
          env: [{ name: SYNCTHING_API_KEY, valueFrom: { secretKeyRef: { name: kitesync-application, key: hub-api-key } } }]
          ports: [{ name: sync-tcp, containerPort: 22000 }, { name: sync-quic, containerPort: 22000, protocol: UDP }]
          readinessProbe: { tcpSocket: { port: sync-tcp }, periodSeconds: 5 }
          livenessProbe: { tcpSocket: { port: sync-tcp }, initialDelaySeconds: 20 }
          resources: {{- toYaml .Values.hub.resources.syncthing | nindent 12 }}
          volumeMounts: [{ name: state, mountPath: /var/syncthing/config }, { name: data, mountPath: /var/syncthing/data }]
        - name: hub-agent
          image: {{ .Values.hub.agentImage }}
          env:
            - { name: KITESYNC_SYNCTHING_URL, value: "http://127.0.0.1:8384" }
            - { name: KITESYNC_SYNCTHING_API_KEY, valueFrom: { secretKeyRef: { name: kitesync-application, key: hub-api-key } } }
            - { name: KITESYNC_HUB_AGENT_STATE_PATH, value: /var/syncthing/config/kitesync-agent-state.json }
            - { name: KITESYNC_HUB_AGENT_TLS_CA, value: /tls/ca.crt }
            - { name: KITESYNC_HUB_AGENT_TLS_CERT, value: /tls/tls.crt }
            - { name: KITESYNC_HUB_AGENT_TLS_KEY, value: /tls/tls.key }
          ports: [{ name: agent-mtls, containerPort: 9443 }]
          readinessProbe: { tcpSocket: { port: agent-mtls }, periodSeconds: 5 }
          resources: {{- toYaml .Values.hub.resources.agent | nindent 12 }}
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } }
          volumeMounts: [{ name: state, mountPath: /var/syncthing/config }, { name: hub-mtls, mountPath: /tls, readOnly: true }]
      volumes: [{ name: hub-mtls, secret: { secretName: {{ .Values.tls.hubAgentSecret }} } }]
  volumeClaimTemplates:
    - metadata: { name: state }
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.global.storageClass }}
        storageClassName: {{ .Values.global.storageClass }}
        {{- end }}
        resources: { requests: { storage: {{ .Values.hub.stateStorage }} } }
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.global.storageClass }}
        storageClassName: {{ .Values.global.storageClass }}
        {{- end }}
        resources: { requests: { storage: {{ .Values.hub.dataStorage }} } }
