name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions: { contents: read }
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.0 }
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run licenses:check
      - run: bun run build
      - run: helm lint deploy/helm/kitesync --set controlPlane.bootstrapToken=ci-bootstrap-token-000000 --set controlPlane.cookieSecret=ci-cookie-secret-000000000000000000 --set hub.apiKey=ci-hub-key --set postgresql.password=ci-postgres --set backup.enabled=false
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.0 }
      - run: bun install --frozen-lockfile
      - run: bun run test:integration
