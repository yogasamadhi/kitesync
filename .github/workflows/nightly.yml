name: Nightly
on:
  schedule: [{ cron: '20 18 * * *' }]
  workflow_dispatch:
permissions: { contents: read }
jobs:
  compose-and-kind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.0 }
      - run: bun install --frozen-lockfile
      - run: bun run dev:certs
      - run: docker compose -f deploy/compose/docker-compose.yml config --quiet
      - run: helm template kitesync deploy/helm/kitesync --set controlPlane.bootstrapToken=nightly-bootstrap-token --set controlPlane.cookieSecret=nightly-cookie-secret-0000000000000000 --set hub.apiKey=nightly-hub-key --set postgresql.password=nightly-postgres --set backup.enabled=false > rendered.yaml
      - uses: helm/kind-action@v1
      - run: kubectl apply --dry-run=server -f rendered.yaml
